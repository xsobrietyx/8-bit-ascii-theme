title: "8Bit ASCII Theme"
description: "A retro ASCII-inspired Jekyll theme"
# These are just sample settings you may want to override or expand.
theme: my-8bit-ascii-theme

# The base URL for your site if it's being served from a subpath
# baseurl: "/my-8bit-ascii-site"
url: "https://example.com"

# Exclude directories and files from _site generation
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules

# If you want to enable future posts, you can do so:
future: false
